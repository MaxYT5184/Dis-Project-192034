<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Webhook Message Builder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Webhook Message Builder</h1>

        <label for="password">Enter Password:</label>
        <input type="password" id="password" placeholder="Enter password">
        <button onclick="authenticate()">Login</button>

        <div id="builder" style="display: none;">
            <label for="server-select">Select Server:</label>
            <select id="server-select">
                <option value="1362193917759590551">Max Dev Server</option>
                <option value="1100631355571834922">Stephen Server</option>
            </select>
            <button onclick="pinServer()">Pin Server</button>

            <label for="webhook-url">Webhook URL:</label>
            <input type="text" id="webhook-url" placeholder="Webhook URL will auto-load">

            <label for="message-content">Message Content:</label>
            <textarea id="message-content" placeholder="Enter your message"></textarea>

            <label for="schedule-time">Schedule Time:</label>
            <input type="datetime-local" id="schedule-time">
            <button id="schedule-webhook">Schedule Message</button>

            <div class="embed-builder">
                <h3>Embed Customization</h3>
                <label for="embed-title">Title:</label>
                <input type="text" id="embed-title">
                <label for="embed-description">Description:</label>
                <textarea id="embed-description"></textarea>
                <label for="embed-color">Embed Color:</label>
                <input type="color" id="embed-color">
                <button id="add-embed">Add Embed</button>
            </div>

            <button id="send-webhook">Send Webhook</button>
            <div id="preview"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
